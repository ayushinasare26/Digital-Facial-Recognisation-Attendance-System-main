<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Employee Login | GeoFace Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=5">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #064e3b 0%, #065f46 40%, #0f172a 100%);
            padding: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            padding: 40px 36px;
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="logo-badge mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem; background: linear-gradient(135deg, #059669 0%, #10b981 100%); display:flex; align-items:center; justify-content:center; border-radius:14px; color:white;">
                <i class="bi bi-geo-alt-fill"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Workforce Attendance Portal</h4>
            <p class="text-muted small">Geo-Verified Facial Recognition Check-In / Check-Out</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3 d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <form method="POST" action="/employee/login">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Employee Code / ID / Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-badge text-muted"></i></span>
                    <input type="text" name="identifier" class="form-control border-start-0 ps-0" placeholder="e.g. EMP-0029 or 29" value="29" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" value="employee123" required>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 shadow-sm mb-3" style="background: #059669; border-color: #059669;">
                Sign In to Employee Portal
            </button>
        </form>

        <!-- Demo Workforce Profiles -->
        {% if demo_employees %}
        <div class="my-3">
            <div class="text-muted text-uppercase fw-bold text-center mb-2" style="font-size: 0.68rem; letter-spacing: 0.05em;">Or Quick Sign-In As Enrolled Employee:</div>
            <div class="d-flex flex-wrap gap-2 justify-content-center">
                {% for de in demo_employees %}
                <form method="POST" action="/employee/login" class="d-inline">
                    <input type="hidden" name="demo_employee_id" value="{{ de.id }}">
                    <button type="submit" class="btn btn-outline-secondary btn-sm rounded-pill px-2 py-1" style="font-size: 0.76rem;" title="{{ de.department_name }} • {{ de.site_name }}">
                        <i class="bi bi-person-check me-1 text-success"></i>{{ de.name }} ({{ de.employee_code }})
                    </button>
                </form>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
            <a href="/manager/dashboard" class="text-decoration-none small text-muted d-flex align-items-center gap-1">
                <i class="bi bi-people-fill text-warning"></i> Manager Portal
            </a>
            <a href="/admin/login" class="text-decoration-none small text-muted d-flex align-items-center gap-1">
                <i class="bi bi-shield-lock text-primary"></i> HR / Admin Portal
            </a>
        </div>
    </div>
</div>
</body>
</html>
