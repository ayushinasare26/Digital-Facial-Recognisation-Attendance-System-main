<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login | GeoFace Portal</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=4">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #090d16 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #f8fafc;
            padding: 20px;
        }
        .admin-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            padding: 36px;
        }
        .admin-badge {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
            margin: 0 auto 20px auto;
        }
        .form-control-admin {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 12px 16px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .form-control-admin:focus {
            background: rgba(15, 23, 42, 0.95);
            border-color: #6366f1;
            color: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }
        .btn-admin-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
        }
        .btn-admin-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5);
            color: white;
        }
    </style>
</head>
<body>

<div class="admin-card">
    <div class="text-center">
        <div class="admin-badge">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h4 class="fw-bold mb-1 text-white">Administrator Portal</h4>
        <p class="text-secondary small mb-4">Elevated privileges required to proceed</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3 border-0 bg-danger text-white">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/login">
        <div class="mb-3">
            <label class="form-label small fw-semibold text-light mb-1">Admin Username</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary">
                    <i class="bi bi-person-fill"></i>
                </span>
                <input type="text" name="username" class="form-control form-control-admin" placeholder="admin" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-semibold text-light mb-1">Secret Password</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary">
                    <i class="bi bi-key-fill"></i>
                </span>
                <input type="password" name="password" class="form-control form-control-admin" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-admin-primary w-100 mb-3">
            <i class="bi bi-lock-fill me-1"></i> Authenticate & Enter
        </button>
    </form>

    <!-- Quick Demo Shortcut -->
    <form method="POST" action="/admin/login" class="mt-2">
        <input type="hidden" name="demo_admin" value="true">
        <button type="submit" class="btn btn-sm btn-outline-light w-100 rounded-pill py-2 opacity-75 hover-opacity-100" style="border-style: dashed; font-size: 0.8rem;">
            <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Admin Login (admin / admin123)
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
        <span class="text-muted small">Not an administrator?</span>
        <a href="/portal/login" class="text-info small fw-semibold ms-1 text-decoration-none">
            Go to Student Portal &rarr;
        </a>
    </div>
</div>

</body>
</html>
